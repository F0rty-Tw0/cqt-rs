name: CI

# Two release gates share this workflow. The `library-*` jobs are the
# acceptance list of the published `cqt-rs` crate: a release is cut only
# when they pass on the tagged commit, and `library-package` proves the
# crate packages as it will be published. The `monitor-*` jobs gate the
# unpublished `cqt-monitor` crate on its own unit tests and an end-to-end
# detection on synthetic audio; they may fail without blocking a library
# release, and the library jobs never build the monitor.

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  library-check:
    name: Library format, lint, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package cqt-rs --check
      - run: cargo clippy --package cqt-rs --all-targets --all-features
      - run: cargo clippy --package cqt-rs --all-targets --no-default-features
      - run: cargo doc --package cqt-rs --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  library-test:
    name: Library test (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.98"]
        features: ["", "--no-default-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --package cqt-rs --release ${{ matrix.features }}

  library-package:
    name: Library packages for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --package cqt-rs --no-run
      # The packaged crate must build on its own, without the workspace.
      - run: cargo publish --package cqt-rs --dry-run
      - name: CHANGELOG covers the crate version
        run: |
          version=$(cargo pkgid --package cqt-rs | sed 's/.*[#@]//')
          grep -q "^# $version " CHANGELOG.md || {
            echo "CHANGELOG.md has no '# $version' heading"; exit 1; }

  monitor-check:
    name: Monitor format, lint, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package cqt-monitor --check
      - run: cargo clippy --package cqt-monitor --all-targets --all-features
      - run: cargo clippy --package cqt-monitor --all-targets --no-default-features
      - run: cargo doc --package cqt-monitor --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo bench --package cqt-monitor --no-run

  monitor-test:
    name: Monitor test and end-to-end detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --package cqt-monitor --release

  evaluation-test:
    name: Evaluation provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy matplotlib
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
