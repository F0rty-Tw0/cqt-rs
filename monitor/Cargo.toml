[package]
name = "cqt-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Artiom Tofan <artiomtofancv@gmail.com>"]
description = "Real-time watch-list audio fingerprinting on top of cqt-rs: peak picking, pitch- and tempo-invariant hashes, sliding-window matching"
license = "MIT"
repository = "https://github.com/F0rty-Tw0/cqt-rs"
publish = false

[dependencies]
cqt-rs = { path = "..", default-features = false }
hound = "3.5"

[features]
default = ["parallel"]
parallel = ["cqt-rs/parallel"]

[lints.rust]
unsafe_code = "forbid"
