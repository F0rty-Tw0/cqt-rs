[package]
name = "cqt-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
authors = ["Artiom Tofan <artiomtofancv@gmail.com>"]
description = "Constant-Q and variable-Q transform for audio fingerprinting and real-time spectral analysis"
documentation = "https://docs.rs/cqt-rs"
readme = "README.md"
license = "MIT"
repository = "https://github.com/F0rty-Tw0/cqt-rs"
keywords = ["cqt", "signal-processing", "dsp", "audio", "fft"]
categories = ["multimedia::audio", "science", "mathematics"]
exclude = ["/.github/**", "/.gitignore"]

[lib]
name = "cqt_rs"
path = "src/lib.rs"

[features]
default = ["parallel"]
# Process batch frames on a rayon thread pool.
parallel = ["dep:rayon"]

[dependencies]
hann-rs = "0.2"
ndarray = { version = "0.17", default-features = false, features = ["std"] }
rayon = { version = "1.10", optional = true }
realfft = "3.5"
rustfft = "6.4"
thiserror = "2"

[dev-dependencies]
approx = "0.5"
criterion = "0.8"
plotters = { version = "0.3.7", default-features = false, features = [
  "svg_backend",
  "line_series",
] }

[[bench]]
name = "bench"
harness = false

[lints.rust]
unsafe_code = "forbid"

[profile.bench]
debug = false
